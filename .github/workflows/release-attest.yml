name: Attest release assets
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  attest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Ensure built bundle matches the repository
        run: git diff --exit-code -- main.js
      - name: Attest main.js and styles.css
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            styles.css